<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Mapa Mental de Microbiologia</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d2330; --muted:#5d6676; --line:#d9d6cc; --accent:#2b5fd9;
  --node:#ffffff; --shadow:0 1px 2px rgba(20,25,40,.08),0 2px 8px rgba(20,25,40,.06);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --bg:#14171e; --panel:#1c212b; --ink:#e8ebf2; --muted:#97a0b2; --line:#2e3542; --accent:#7ea2ff; --node:#1f2531; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
}
:root[data-theme="dark"]{ --bg:#14171e; --panel:#1c212b; --ink:#e8ebf2; --muted:#97a0b2; --line:#2e3542; --accent:#7ea2ff; --node:#1f2531; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--panel);border-bottom:1px solid var(--line)}
h1{font-size:17px;margin:0 8px 0 0;font-weight:700}
nav{display:flex;gap:4px}
.tab{border:0;background:transparent;color:var(--muted);padding:7px 12px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
button.b,select,input[type=search]{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 10px;border-radius:8px;cursor:pointer}
button.b:hover{border-color:var(--accent)}
button.b[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=search]{cursor:text;width:150px}
main{flex:1;min-height:0;position:relative}
section.view{position:absolute;inset:0;display:none;overflow:auto}
section.view.on{display:block}
/* mapa */
#vp{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;
  background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
#vp.drag{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.node{position:absolute;max-width:250px;min-width:60px;padding:7px 11px;border-radius:10px;background:var(--node);
  border:1.5px solid var(--c);box-shadow:var(--shadow);font-size:13.5px;cursor:pointer;user-select:none;transition:opacity .15s}
.node.d0{background:var(--ink);color:var(--bg);border-color:var(--ink);font-size:20px;font-weight:800;padding:14px 20px;max-width:none;cursor:default}
.node.d1{background:var(--c);color:#fff;font-weight:700;font-size:15px;padding:9px 14px}
.node.d2{font-weight:650;border-width:2px}
.node.tip{border-style:dashed;background:transparent;font-style:italic;color:var(--muted);box-shadow:none}
.node.has::after{content:attr(data-n);position:absolute;right:-9px;top:50%;transform:translateY(-50%);min-width:18px;height:18px;border-radius:9px;
  background:var(--c);color:#fff;font:700 10.5px/18px system-ui;text-align:center;padding:0 4px}
.node.has.open::after{content:"–";}
.node.d0::after{display:none}
.node.has{padding-right:20px}
.node.dim{opacity:.18}
.node.hit{outline:3px solid #f5b50a;outline-offset:2px}
.node.done{border-color:#1f9d55;box-shadow:0 0 0 2px rgba(31,157,85,.25)}
.node .ok{display:none;position:absolute;left:-9px;top:-9px;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--c);background:var(--panel);color:#1f9d55;font-size:11px;line-height:17px;text-align:center;padding:0}
.node:hover .ok,.node.done .ok{display:block}
.node.done .ok{background:#1f9d55;color:#fff;border-color:#1f9d55}
.node.d0 .ok,.node.d1 .ok{display:none!important}
.recall .node.leaf:not(.shown):not(.tip) .t{filter:blur(6px)}
.recall .node.leaf:not(.shown):not(.tip){cursor:help}
.badge{font-size:11px;font-weight:700;opacity:.85;margin-left:6px}
#legend{position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--muted);max-width:360px;line-height:1.6}
#prog{position:absolute;right:12px;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;min-width:170px}
#prog .bar{height:6px;border-radius:3px;background:var(--line);margin-top:5px;overflow:hidden}
#prog .bar i{display:block;height:100%;background:#1f9d55;width:0}
/* paineis */
.page{max-width:980px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 60px max(16px,env(safe-area-inset-left,0px))}
.page h2{margin:26px 0 8px;font-size:19px}
.page h2:first-child{margin-top:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.page .tw,.page{overflow-x:hidden}
table{display:block;overflow-x:auto;width:100%;border-collapse:collapse;font-size:13.5px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:color-mix(in srgb,var(--accent) 14%,var(--panel));font-size:12.5px}
tr:last-child td{border-bottom:0}
.warn{border-left:4px solid #e08a00}
.tipbox{border-left:4px solid var(--accent)}
ul{padding-left:20px;margin:6px 0}
li{margin:3px 0}
.muted{color:var(--muted)}
/* flashcards */
#fc{max-width:620px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-right,0px)) 22px max(16px,env(safe-area-inset-left,0px));text-align:center}
.flip{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;min-height:230px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px;cursor:pointer;box-shadow:var(--shadow);font-size:18px}
.flip small{color:var(--muted);font-size:12px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.05em}
.flip.back{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.row .b{padding:9px 16px;font-size:14px}
.good{background:#1f9d55!important;color:#fff!important;border-color:#1f9d55!important}
.bad{background:#d0453b!important;color:#fff!important;border-color:#d0453b!important}
</style>
</head>
<body>
<header>
  <h1>🔬 Microbiologia · CETEC</h1>
  <nav id="tabs" role="tablist">
    <button class="tab" role="tab" data-v="map" aria-selected="true">Mapa mental</button>
    <button class="tab" role="tab" data-v="cards" aria-selected="false">Flashcards</button>
    <button class="tab" role="tab" data-v="comp" aria-selected="false">Comparativos</button>
    <button class="tab" role="tab" data-v="plan" aria-selected="false">Como estudar</button>
  </nav>
  <div class="tools" id="maptools">
    <input type="search" id="q" placeholder="Buscar termo…" aria-label="Buscar">
    <button class="b" id="bAll">Expandir tudo</button>
    <button class="b" id="bOne">Só ramos</button>
    <button class="b" id="bFit">Ajustar tela</button>
    <button class="b" id="bTip" aria-pressed="true">💡 Dicas</button>
    <button class="b" id="bRecall" aria-pressed="false" title="Esconde os detalhes finais; clique para revelar e tente lembrar antes">🧠 Modo recall</button>
    <button class="b" id="bReset" title="Zerar os ✓ de progresso">Zerar ✓</button>
  </div>
</header>
<main>
  <section class="view on" id="v-map">
    <div id="vp"><div id="world"><svg id="links"></svg></div></div>
    <div id="prog"><b id="pt">Progresso</b><div class="bar"><i id="pb"></i></div></div>
    <div id="legend">Clique num ramo: abre/fecha · Arraste: move · Roda do mouse ou pinça: zoom<br>
      <b>✓</b> (passe o mouse num item) marca como dominado · <b>🧠 Modo recall</b>: esconde os detalhes, você tenta lembrar e clica para conferir
      <br><button class="b" id="hideLeg" style="margin-top:6px;padding:3px 8px">Entendi, ocultar</button></div>
  </section>
  <section class="view" id="v-cards"><div id="fc"></div></section>
  <section class="view" id="v-comp"><div class="page" id="compPage"></div></section>
  <section class="view" id="v-plan"><div class="page" id="planPage"></div></section>
</main>

<script>
/* ============ DADOS: tudo extraído da apostila (💡 = dica de memorização minha, não é da apostila) ============ */
const n=(t,c)=>({t,c:c||[]});
const DATA = n("Microbiologia",[
 n("1 · História",[
  n("Leeuwenhoek · 1674",[n("Criou o 1º microscópio"),n("Viu seres em solo, rio, saliva e fezes → “animálculos”"),n("Cartas à Sociedade Real inglesa deram início à Microbiologia")]),
  n("Pasteur · 1857–1914",[n("Fermentação do vinho = microrganismos (leveduras), não “espontânea”"),n("Acidificar o vinho conserva; deterioração = bactérias"),n("1864: aquecer a 56 °C mata os que alteram o gosto → PASTEURIZAÇÃO (leites e sucos)")]),
  n("Koch · 1876",[n("1ª prova de que bactéria causa doença: carbúnculo (gado e ovelhas)"),n("Postulados de Koch (4 regras)",[n("1. Presença do micróbio no doente"),n("2. Isolamento em cultura"),n("3. Reprodução da doença"),n("4. Reisolamento do agente"),n("💡 P-I-R-R: Presença → Isolar → Reproduzir → Reisolar")])]),
  n("Gram · 1888–1893",[n("Método de coloração que separa 2 classes de bactérias"),n("Padronizado e obrigatório nas aulas até hoje")]),
  n("Fleming · 1928",[n("Descobriu a PENICILINA"),n("Placa de estafilococos contaminada por bolor → cultura se dissolvia ao redor"),n("Bolor = fungo Penicillium; ação bacteriolítica"),n("Nobel aos 64 anos")])
 ]),
 n("2 · Conceitos de clínica",[
  n("Definições",[n("Patologia: estudo científico das doenças (mudanças estruturais e funcionais)"),n("Patogênese: COMO a doença se desenvolve (evolução)"),n("Patogenicidade: capacidade de causar doença superando as defesas do hospedeiro"),n("Virulência: GRAU de patogenicidade"),n("Infecção: invasão/colonização por patógenos — pode existir sem doença"),n("Doença infecciosa: infecção que altera o estado de saúde"),n("💡 Patogenicidade = “pode?”  ·  Virulência = “quão forte?”")]),
  n("Patógeno oportunista",[n("Vive na microbiota, mas causa doença quando sai do lugar habitual ou há queda imunológica"),n("Ex.: Candida albicans (TGI e genital) → candidíase")]),
  n("Microbiotas do corpo",[n("Pele: Propionibacterium, Staphylococcus, Micrococcus, Candida"),n("Nariz/garganta: S. aureus, S. epidermidis, S. pneumoniae, Haemophilus, Neisseria (garganta)"),n("Boca: Streptococcus, Lactobacillus, Staphylococcus, Candida"),n("Intestino: E. coli, Bacteroides, Fusobacterium, Enterococcus, Bifidobacterium, Proteus, Klebsiella"),n("Genital: Staphylococcus, Enterococcus, Lactobacillus, Pseudomonas, Klebsiella, Trichomonas vaginalis (protozoário)")]),
  n("Portas de entrada",[n("Cutânea / parenteral / conjuntiva"),n("Trato respiratório"),n("Trato gastrointestinal"),n("Trato urinário / genital"),n("Patógeno precisa: entrar → aderir → escapar das defesas")])
 ]),
 n("3 · Procariontes × Eucariontes",[
  n("Procariontes",[n("Bactérias e arqueias"),n("Sem núcleo delimitado por membrana")]),
  n("Eucariontes",[n("Fungos (bolores e leveduras), protozoários, algas, plantas e animais"),n("DNA no núcleo (membrana nuclear)"),n("Organelas: mitocôndria, RE, Golgi, lisossomo, cloroplastos")]),
  n("Em comum",[n("Ácidos nucleicos, proteínas, lipídeos e carboidratos")])
 ]),
 n("4 · Bactérias",[
  n("Tamanho, forma e arranjo",[n("0,2–2,0 µm de diâmetro · 2–8 µm de comprimento"),n("Cocos (esféricos): redondos, ovais, alongados"),n("Bacilos (bastão): único, diplobacilo, estreptobacilo (cadeia)"),n("Espirais: mais curvaturas, não retas (vibriões, segundo a apostila)")]),
  n("Estruturas EXTERNAS",[
   n("Glicocálice / cápsula",[n("Polímero viscoso aderido à parede"),n("Fixação a superfícies; fator de virulência"),n("Foge da fagocitose"),n("Biofilme = substância polimérica extracelular protetora")]),
   n("Flagelo",[n("Filamento que move a bactéria"),n("Giro forma feixe que empurra o líquido")]),
   n("Fímbrias",[n("Aderência e colonização"),n("Ex.: Neisseria gonorrhoeae adere às mucosas")]),

  ]),
  n("Coloração de Gram",[
   n("Passos / corantes",[n("1. Cristal violeta (violeta genciana) + 2. Lugol (iodo) → formam cristais"),n("3. Descolorante álcool-acetona"),n("4. Safranina (contra-corante)")]),

   n("Gram NEGATIVA → rosa/vermelha",[n("Camada FINA de peptideoglicano + lipopolissacarídeo (LPS) de membrana"),n("Álcool-acetona remove os cristais; safranina cora de rosa")]),

   n("Ribossomos",[n("Síntese de proteínas"),n("Dezenas de milhares → aspecto granuloso")]),

  ]),
  n("Crescimento",[

   n("Oxigênio",[n("Aeróbias estritas: só com O₂"),n("Anaeróbias estritas: só sem nenhum O₂"),n("Anaeróbias facultativas: toleram O₂ mas crescem sem ele — E. coli, Salmonella, enterobactérias")])

  n("Microbiota normal (Quadro 1)",[

   n("Corynebacterium: nasofaringe, pele, vagina · bacilo Gram+"),
   n("Enterococcus faecalis: cólon · coco Gram+ (urinária/hospitalar)"),
   n("E. coli: cólon, vagina, uretra distal · bacilo Gram–"),
   n("Gardnerella vaginalis: vagina · vaginose bacteriana"),
   n("Haemophilus: nasofaringe, conjuntiva · cocobacilo Gram–"),
   n("Lactobacillus: boca, cólon, vagina · bacilo Gram+ (pH vaginal)"),
   n("Neisseria: boca, nasofaringe · cocos Gram–"),
   n("Cutibacterium acnes: pele, glândulas sebáceas · acne"),
   n("Pseudomonas aeruginosa: cólon, pele · Gram–, oportunista"),
   n("S. aureus: narinas, pele · infecções piogênicas"),
   n("S. epidermidis: pele, nariz, boca, vagina, uretra · biofilme em próteses"),
   n("Estreptococos viridans: boca, nasofaringe · endocardite"),
   n("Candida albicans: boca, cólon, vagina · fungo")
  ])
 ]),
 n("5 · Fungos",[
  n("Estrutura",[
   n("Bolores (fungos filamentosos)",[n("Hifas = filamentos de células; septadas (com septo) ou cenocíticas (contínuas)"),n("Hifa vegetativa: nutrientes · reprodutiva: reprodução"),n("Micélio = conjunto de hifas (o “mofo/algodão”)")]),
   n("Leveduras",[n("Unicelulares, esféricas/ovais; sem hifas nem micélio"),n("Ex.: Candida albicans; Saccharomyces cerevisiae (cerveja, pão)"),n("Brotamento ou fissão (>24 células por broto)"),n("Pseudo-hifas: brotos que não se soltam, em fileira")]),
   n("Fungos dimórficos",[n("Alternam levedura ↔ filamento"),n("Fator de patogenicidade: esporos aéreos são inalados"),n("Histoplasma, Paracoccidioides, Cryptococcus, Aspergillus")])
  ]),
  n("Reprodução",[
   n("Filamentosos: fragmentação das hifas · Leveduras: brotamento/fissão"),
   n("Esporos assexuados: formados pelas hifas, geneticamente iguais ao parental"),
   n("Esporos sexuados: fusão de núcleos de cepas opostas da mesma espécie"),
   n("Toleram pH ~5 (ácido demais para bactérias)")
  ]),
  n("Micoses",[
   n("Superficiais: fios de cabelo e epiderme superficial · Pitiríase versicolor (Malassezia)"),
   n("Cutâneas: dermatófitos secretam queratinase (pele, unha, cabelo) · Microsporum, Trichophyton, Epidermophyton"),
   n("Subcutâneas: fungos saprófitas do solo/vegetação · Esporotricose (Sporothrix schenckii, de plantas)"),
   n("Sistêmicas: esporos inalados → pulmão → disseminam · Histoplasmose, Paracoccidioidomicose, Coccidioidomicose, Blastomicose"),
   n("Oportunistas: Candidíase, Criptococose, Aspergilose, Mucormicose, Pneumocystis jirovecii (AIDS)")
  ])
 ]),
 n("6 · Vírus",[

  n("Resp. comuns (Quadro 3)",[n("Resfriado: rinovírus, coronavírus, adenovírus"),n("Faringite/laringite: adenovírus, coxsackie, herpes simples"),n("Crupe (tosse de cachorro): parainfluenza, influenza"),n("Bronquiolite: sincicial respiratório, parainfluenza, influenza")])

  n("Grupos de importância médica",[
   n("Excavata",[n("Giardia duodenalis (lamblia): delgado, cisto nas fezes"),n("Trichomonas vaginalis: transmissão sexual"),n("Euglenozoa/hemoflagelados: Trypanosoma brucei (sono), T. cruzi (Chagas, barbeiro)")]),
   n("Amoebozoa",[n("Amebas/pseudópodes: Entamoeba histolytica, Amoeba proteus, Balamuthia")]),

  ]),

const countLeaves=x=>x.tip?[]:(x.leaf?[x]:x.c.flatMap(countLeaves));

function visible(x,out=[]){
  if(x.tip&&!store.tips)return out;
  out.push(x);
  if(open.has(x.id))x.c.forEach(c=>visible(c,out));
  return out;
}
function render(anchor){
  let before=null;
  if(anchor!=null){const el=world.querySelector(`[data-id="${anchor}"]`);if(el)before=el.getBoundingClientRect()}
  world.querySelectorAll(".node").forEach(e=>e.remove());
  const vis=visible(DATA);
  const els={};
  vp.classList.toggle("recall",recall);
  const frag=document.createDocumentFragment();
  vis.forEach(x=>{
    const e=document.createElement("div");
    e.className="node d"+Math.min(x.d,3)+(x.tip?" tip":"")+(x.leaf?" leaf":"")+(x.c.some(c=>!(c.tip&&!store.tips))?" has":"")+(open.has(x.id)?" open":"");
    if(store.done[x.id])e.classList.add("done");
    if(shown.has(x.id))e.classList.add("shown");
    if(query){e.classList.add(hits.has(x.id)?"hit":"dim")}
    e.dataset.id=x.id;
    e.dataset.n=x.c.filter(c=>!(c.tip&&!store.tips)).length;
    e.style.setProperty("--c",x.col);
    let label=esc(x.t);
    e.innerHTML=`<span class="t">${label}</span>`;
    if(x.d===1){const L=countLeaves(x),dn=L.filter(l=>store.done[l.id]).length;e.innerHTML+=`<span class="badge">${dn}/${L.length}</span>`}
    if(x.leaf&&!x.tip)e.insertAdjacentHTML("afterbegin",`<button class="ok" title="Marcar como dominado" aria-label="Marcar como dominado">✓</button>`);
    els[x.id]=e;frag.appendChild(e);
  });
  world.appendChild(frag);
  // medir
  const W={},H={};vis.forEach(x=>{W[x.id]=els[x.id].offsetWidth;H[x.id]=els[x.id].offsetHeight});
  const GX=46,GY=9,maxW=[];
  vis.forEach(x=>{maxW[x.d]=Math.max(maxW[x.d]||0,W[x.id])});
  const colX=[0];for(let d=1;d<maxW.length;d++)colX[d]=colX[d-1]+maxW[d-1]+GX;
  const kids=x=>open.has(x.id)?x.c.filter(c=>vis.includes(c)):[];
  const sub={};
  (function h(x){const k=kids(x);k.forEach(h);const tot=k.reduce((a,c)=>a+sub[c.id],0)+GY*Math.max(0,k.length-1);x._ch=tot;sub[x.id]=Math.max(H[x.id],tot)})(DATA);
  const pos={};
  (function lay(x,top){
    const s=sub[x.id],cy=top+s/2;pos[x.id]={x:colX[x.d],cy};
    const k=kids(x);let y=top+(s-x._ch)/2;
    k.forEach(c=>{lay(c,y);y+=sub[c.id]+GY});
  })(DATA,0);
  let paths="",maxX=0;
  vis.forEach(x=>{
    const p=pos[x.id],e=els[x.id];
    e.style.left=p.x+"px";e.style.top=(p.cy-H[x.id]/2)+"px";
    maxX=Math.max(maxX,p.x+W[x.id]);
    kids(x).forEach(c=>{
      const q=pos[c.id],x1=p.x+W[x.id],y1=p.cy,x2=q.x,y2=q.cy,m=(x1+x2)/2;
      paths+=`<path d="M${x1},${y1} C${m},${y1} ${m},${y2} ${x2},${y2}" fill="none" stroke="${c.col}" stroke-width="${Math.max(1.4,4-c.d*.7)}" stroke-linecap="round" opacity=".75"/>`;
    });
  });
  svg.innerHTML=paths;
  svg.setAttribute("width",maxX+60);svg.setAttribute("height",sub[DATA.id]+20);
  world.style.width=(maxX+60)+"px";world.style.height=(sub[DATA.id]+20)+"px";
  world._bounds={w:maxX+20,h:sub[DATA.id]};
  if(before){const el=world.querySelector(`[data-id="${anchor}"]`);if(el){const a=el.getBoundingClientRect();tx+=before.left-a.left;ty+=before.top-a.top}}
  applyT();progress();
}
function progress(){
  const L=countLeaves(DATA),dn=L.filter(l=>store.done[l.id]).length;
  document.getElementById("pt").textContent=`Dominado: ${dn} de ${L.length} (${Math.round(100*dn/L.length)}%)`;
  document.getElementById("pb").style.width=(100*dn/L.length)+"%";
}
function fit(){
  const b=world._bounds,r=vp.getBoundingClientRect();
  sc=Math.min(1.1,(r.width-40)/b.w,(r.height-40)/b.h);
  tx=20;ty=Math.max(20,(r.height-b.h*sc)/2);applyT();
}
// interação nó
world.addEventListener("click",ev=>{
  const ok=ev.target.closest(".ok");
  const el=ev.target.closest(".node");if(!el)return;
  const x=byId[el.dataset.id];
  if(ok){store.done[x.id]=!store.done[x.id];if(!store.done[x.id])delete store.done[x.id];save();render(x.id);return}
  if(vp._moved)return;
  if(recall&&x.leaf&&!x.tip&&!shown.has(x.id)){shown.add(x.id);render(x.id);return}
  if(x.c.length&&x.d>0){open.has(x.id)?open.delete(x.id):open.add(x.id);render(x.id)}
});
// pan / zoom (mouse, roda e pinça)
const ptrs=new Map();let pinch=null;
vp.addEventListener("pointerdown",e=>{if(e.target.closest(".ok"))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,tx,ty};vp._moved=false}
  else if(ptrs.size===2){drag=null;vp._moved=true;const [p,q]=[...ptrs.values()];pinch={d:Math.hypot(p.x-q.x,p.y-q.y),sc,tx,ty,mx:(p.x+q.x)/2,my:(p.y+q.y)/2}}});
let drag=null;
window.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size>=2){const [p,q]=[...ptrs.values()],d=Math.hypot(p.x-q.x,p.y-q.y),r=vp.getBoundingClientRect();
    const ns=Math.min(2.2,Math.max(.2,pinch.sc*d/pinch.d)),mx=pinch.mx-r.left,my=pinch.my-r.top;
    tx=mx-(mx-pinch.tx)*(ns/pinch.sc);ty=my-(my-pinch.ty)*(ns/pinch.sc);sc=ns;applyT();return}
  if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>6){vp._moved=true;vp.classList.add("drag")}
  if(vp._moved){tx=drag.tx+dx;ty=drag.ty+dy;applyT()}});
const endP=e=>{ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;if(!ptrs.size){drag=null;vp.classList.remove("drag");setTimeout(()=>vp._moved=false,0)}};
window.addEventListener("pointerup",endP);window.addEventListener("pointercancel",endP);
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;const k=Math.exp(-e.deltaY*.0015),ns=Math.min(2.2,Math.max(.2,sc*k));tx=mx-(mx-tx)*(ns/sc);ty=my-(my-ty)*(ns/sc);sc=ns;applyT()},{passive:false});

// botões
const $=id=>document.getElementById(id);
$("bAll").onclick=()=>{all.forEach(x=>x.c.length&&open.add(x.id));render();fit()};
$("bOne").onclick=()=>{open.clear();open.add(DATA.id);render();fit()};
$("bFit").onclick=fit;
$("bTip").onclick=e=>{store.tips=!store.tips;e.currentTarget.setAttribute("aria-pressed",store.tips);save();render()};
$("bRecall").onclick=e=>{recall=!recall;shown.clear();e.currentTarget.setAttribute("aria-pressed",recall);render()};
let rst=0;$("bReset").onclick=e=>{const b=e.currentTarget;if(!rst){b.textContent="Tem certeza? Clique de novo";rst=setTimeout(()=>{rst=0;b.textContent="Zerar ✓"},3000);return}clearTimeout(rst);rst=0;b.textContent="Zerar ✓";store.done={};save();render()};
$("bTip").setAttribute("aria-pressed",store.tips);
if(store.hideLeg)$("legend").style.display="none";
$("hideLeg").onclick=()=>{$("legend").style.display="none";store.hideLeg=true;save()};
$("q").addEventListener("input",e=>{
  query=e.target.value.trim().toLowerCase();hits=new Set();
  if(query){
    all.forEach(x=>{if(x.t.toLowerCase().includes(query)){hits.add(x.id);for(let p=x.p;p;p=p.p)open.add(p.id)}});
  }
  render();
});

// abas
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t===b));
  document.querySelectorAll(".view").forEach(v=>v.classList.toggle("on",v.id==="v-"+b.dataset.v));
  $("maptools").style.display=b.dataset.v==="map"?"flex":"none";
  if(b.dataset.v==="map")fit();
});
$("compPage").innerHTML=COMP;$("planPage").innerHTML=PLAN;

/* ============ FLASHCARDS ============ */
const themes=[...new Set(CARDS.map(c=>c[2]))];
let deck=[],ci=0,flipped=false,right=0,wrong=0,theme="Todos";
function buildDeck(shuf){deck=CARDS.filter(c=>theme==="Todos"||c[2]===theme);if(shuf)deck.sort(()=>Math.random()-.5);ci=0;flipped=false;right=wrong=0;drawCard()}
function drawCard(){
  const f=$("fc");
  if(ci>=deck.length){f.innerHTML=`<div class="flip"><b style="font-size:22px">Fim do baralho 🎉</b><p>Acertei: <b>${right}</b> · Revisar: <b>${wrong}</b></p></div>
  <div class="row"><button class="b" id="again">Recomeçar</button></div>${opts()}`;$("again").onclick=()=>buildDeck(true);bindOpts();return}
  const c=deck[ci];
  f.innerHTML=`${opts()}<div class="muted" style="margin:10px 0">Card ${ci+1} de ${deck.length} · ✓ ${right} · ✗ ${wrong}</div>
  <div class="flip ${flipped?"back":""}" id="card" tabindex="0"><small>${c[2]} · ${flipped?"resposta":"pergunta"}</small>${esc(flipped?c[1]:c[0])}</div>
  <div class="row">${flipped?`<button class="b bad" id="no">Errei / revisar</button><button class="b good" id="yes">Acertei</button>`:`<button class="b" id="show">Ver resposta</button>`}</div>
  <div class="muted" style="font-size:12px">Tente responder em voz alta antes de virar.</div>`;
  bindOpts();
  const flip=()=>{flipped=true;drawCard()};
  $("card").onclick=()=>{flipped=!flipped;drawCard()};
  if($("show"))$("show").onclick=flip;
  if($("yes"))$("yes").onclick=()=>{right++;ci++;flipped=false;drawCard()};
  if($("no"))$("no").onclick=()=>{wrong++;deck.push(c);ci++;flipped=false;drawCard()};
}
const opts=()=>`<div class="row"><select id="th" aria-label="Tema">${["Todos",...themes].map(t=>`<option ${t===theme?"selected":""}>${t}</option>`).join("")}</select><button class="b" id="shuf">Embaralhar</button></div>`;
function bindOpts(){$("th").onchange=e=>{theme=e.target.value;buildDeck(true)};$("shuf").onclick=()=>buildDeck(true)}
buildDeck(true);

render();fit();
addEventListener("load",()=>{render();fit()});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{render();fit()});
let rt;addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(()=>{if($("v-map").classList.contains("on"))fit()},150)});
</script>
</body>
</html>
